
trigger:
  - main

pr:
  - main

pool:
  vmImage: 'ubuntu-latest'

steps:
  - script: |
      php --version
      find . -name "*.php" -type f
    displayName: 'Check PHP Environment and Files'

  - script: |
      find . -name "*.php" -type f -print0 | xargs -0 -r -n1 php -l
    displayName: 'Validate PHP Syntax'

  - script: |
      docker --version
      docker build -t qr-restaurant-system:ci -f Dockerfile .
    displayName: 'Build Docker Image'
